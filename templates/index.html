<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Filament Robotu - Fiyat Karşılaştırma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: white; padding: 2.5rem 0; margin-bottom: 2rem; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .price-tag { font-size: 1.25rem; font-weight: bold; color: #198754; }
        .badge-brand { background-color: #6c757d; }
    </style>
</head>
<body>

<div class="hero">
    <div class="container text-center">
        <h1 class="display-5 fw-bold">🤖 3D Filament Robotu</h1>
        <p class="lead">20 Farklı Mağazadan Anlık Filament Fiyat Karşılaştırması</p>
        <button id="btnUpdate" class="btn btn-warning btn-lg mt-2 fw-bold" onclick="triggerUpdate()">🔄 Verileri Güncelle</button>
        <div id="updateStatus" class="small mt-2 text-white-50"></div>
    </div>
</div>

<div class="container">
    <!-- FİLTRELEME BÖLÜMÜ -->
    <div class="card p-3 mb-4">
        <div class="row g-3">
            <!-- MAĞAZA SEÇİM KUTUSU -->
            <div class="col-md-3">
                <label class="form-label fw-bold">🏪 Mağaza / Site</label>
                <select id="filterSource" class="form-select" onchange="loadProducts()">
                    <option value="">Tüm Siteler (20 Mağaza)</option>
                </select>
            </div>
            
            <div class="col-md-3">
                <label class="form-label fw-bold">🏷️ Marka</label>
                <select id="filterBrand" class="form-select" onchange="loadProducts()">
                    <option value="">Tüm Markalar</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">🧪 Materyal</label>
                <select id="filterMaterial" class="form-select" onchange="loadProducts()">
                    <option value="">Tüm Materyaller</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">🎨 Renk</label>
                <select id="filterColor" class="form-select" onchange="loadProducts()">
                    <option value="">Tüm Renkler</option>
                </select>
            </div>

            <div class="col-md-12 mt-3">
                <input type="text" id="searchQuery" class="form-control form-control-lg" placeholder="Filament adı veya renk ara..." onkeyup="loadProducts()">
            </div>
        </div>
    </div>

    <!-- ÜRÜN LİSTESİ -->
    <div id="productList" class="row g-3">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Filamentler Yükleniyor...</p>
        </div>
    </div>
</div>

<script>
async function loadFilters() {
    const res = await fetch('/api/filters');
    const data = await res.json();
    
    populateSelect('filterSource', data.source, 'Tüm Siteler (20 Mağaza)');
    populateSelect('filterBrand', data.brand, 'Tüm Markalar');
    populateSelect('filterMaterial', data.material, 'Tüm Materyaller');
    populateSelect('filterColor', data.color, 'Tüm Renkler');
}

function populateSelect(id, items, defaultText) {
    const select = document.getElementById(id);
    const currentValue = select.value;
    select.innerHTML = `<option value="">${defaultText}</option>`;
    if(items) {
        items.forEach(item => {
            select.innerHTML += `<option value="${item}">${item}</option>`;
        });
    }
    select.value = currentValue;
}

async function loadProducts() {
    const source = document.getElementById('filterSource').value;
    const brand = document.getElementById('filterBrand').value;
    const material = document.getElementById('filterMaterial').value;
    const color = document.getElementById('filterColor').value;
    const q = document.getElementById('searchQuery').value;

    const url = `/api/products?source=${encodeURIComponent(source)}&brand=${encodeURIComponent(brand)}&material=${encodeURIComponent(material)}&color=${encodeURIComponent(color)}&q=${encodeURIComponent(q)}`;
    
    const res = await fetch(url);
    const products = await res.json();
    
    const list = document.getElementById('productList');
    if (products.length === 0) {
        list.innerHTML = `<div class="col-12 text-center py-5"><h4 class="text-muted">Aramanızla eşleşen filament bulunamadı.</h4><p>Lütfen "Verileri Güncelle" butonuna basıp 15 saniye bekleyin.</p></div>`;
        return;
    }

    list.innerHTML = products.map(p => `
        <div class="col-md-4 col-lg-3">
            <div class="card h-100 p-3">
                <span class="badge bg-secondary mb-2 w-auto align-self-start">${p.source}</span>
                <h6 class="card-title text-truncate" title="${p.name}">${p.name}</h6>
                <div class="mb-2">
                    <span class="badge bg-primary">${p.material}</span>
                    <span class="badge bg-info text-dark">${p.color}</span>
                </div>
                <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                    <div>
                        <div class="price-tag">${p.price} TL</div>
                        <small class="text-muted">${p.kg_price ? Math.round(p.kg_price) + ' TL / kg' : ''}</small>
                    </div>
                    <a href="${p.url}" target="_blank" class="btn btn-sm btn-outline-primary">Siteye Git ↗</a>
                </div>
            </div>
        </div>
    `).join('');
}

async function triggerUpdate() {
    const btn = document.getElementById('btnUpdate');
    btn.disabled = true;
    btn.innerText = '⌛ Güncelleniyor...';
    
    await fetch('/api/update', { method: 'POST' });
    
    setTimeout(() => {
        btn.disabled = false;
        btn.innerText = '🔄 Verileri Güncelle';
        loadFilters();
        loadProducts();
    }, 12000);
}

loadFilters();
loadProducts();
</script>
</body>
</html>
