<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Filament Arama Motoru - Fiyat Karşılaştırma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #1e1e1e;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* DÜZEN (LAYOUT) */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* SOL SIDEBAR (FILTERS) */
        .sidebar {
            width: 260px;
            background-color: #141414;
            border-right: 1px solid #2a2a2a;
            padding: 1rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .sidebar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #2a2a2a;
        }

        .sidebar-brand span {
            color: #ff9900;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-select-dark {
            background-color: #242424;
            color: #ffffff;
            border: 1px solid #383838;
            font-size: 0.85rem;
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
        }

        .form-select-dark:focus {
            background-color: #2a2a2a;
            color: #ffffff;
            border-color: #ff9900;
            box-shadow: none;
        }

        /* İÇERİK ALANI (MAIN CONTENT) */
        .main-content {
            flex-grow: 1;
            background-color: #e5e5e5;
            color: #222222;
            display: flex;
            flex-direction: column;
        }

        /* ÜST ARAMA VE BİLGİ BAR */
        .top-bar {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 1px solid #2c2c2c;
        }

        .search-container {
            flex-grow: 1;
            max-width: 520px;
            display: flex;
            gap: 6px;
        }

        .search-input-dark {
            background-color: #2a2a2a;
            border: 1px solid #3d3d3d;
            color: #ffffff;
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
        }

        .search-input-dark:focus {
            background-color: #333333;
            color: #ffffff;
            border-color: #ff9900;
            box-shadow: none;
        }

        .search-input-dark::placeholder {
            color: #888888;
        }

        /* KARE IKON BUTONLARI */
        .btn-icon-square {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border: none;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-update-dark {
            background: #ff9900;
            color: #111111;
        }

        .btn-update-dark:hover {
            background: #e68a00;
        }

        .btn-clear-dark {
            background: #333333;
            border: 1px solid #444444;
            color: #ffffff;
        }

        .btn-clear-dark:hover {
            background: #444444;
            border-color: #555555;
        }

        .stats-bar {
            font-size: 0.85rem;
            color: #aaaaaa;
            font-weight: 500;
        }

        .stats-bar span {
            color: #ffffff;
            font-weight: 700;
        }

        /* GRID ÜRÜN LİSTESİ */
        .products-grid {
            padding: 1.2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            overflow-y: auto;
        }

        /* BEYAZ ÜRÜN KARTLARI */
        .filament-card {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #dcdcdc;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .filament-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }

        .card-color-strip {
            height: 4px;
            width: 100%;
        }

        .card-img-wrap {
            height: 120px;
            background: #fafafa;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-img-wrap img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .card-body-custom {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .brand-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .product-title-custom {
            font-size: 0.8rem;
            font-weight: 600;
            color: #111111;
            line-height: 1.2;
            height: 2.4em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 6px;
        }

        .tags-row {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .tag-pill {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #444444;
            border: 1px solid #e0e0e0;
        }

        .price-section {
            margin-top: auto;
            padding-top: 6px;
            border-top: 1px solid #f2f2f2;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .price-main {
            font-size: 1.05rem;
            font-weight: 800;
            color: #111111;
        }

        .price-sub {
            font-size: 0.7rem;
            color: #777777;
            font-weight: 600;
        }

        .btn-buy-orange {
            background-color: #ff9900;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            padding: 6px;
            border-radius: 5px;
            margin-top: 8px;
            display: block;
            transition: background 0.2s;
        }

        .btn-buy-orange:hover {
            background-color: #e68a00;
            color: #ffffff;
        }

        .svg-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .spinning {
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- SOL SIDEBAR FİLTRELER -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            🧵 Filament<span>Robotu</span>
        </div>

        <div class="filter-group">
            <span class="filter-label">Mağaza / Site</span>
            <select id="filterSource" class="form-select form-select-dark" onchange="loadProducts()">
                <option value="">Tüm Siteler</option>
            </select>
        </div>

        <div class="filter-group">
            <span class="filter-label">Marka</span>
            <select id="filterBrand" class="form-select form-select-dark" onchange="loadProducts()">
                <option value="">Tüm Markalar</option>
            </select>
        </div>

        <div class="filter-group">
            <span class="filter-label">Materyal</span>
            <select id="filterMaterial" class="form-select form-select-dark" onchange="loadProducts()">
                <option value="">Tüm Materyaller</option>
            </select>
        </div>

        <div class="filter-group">
            <span class="filter-label">Renk</span>
            <select id="filterColor" class="form-select form-select-dark" onchange="loadProducts()">
                <option value="">Tüm Renkler</option>
            </select>
        </div>
    </aside>

    <!-- SAĞ ANA İÇERİK ALANI -->
    <main class="main-content">
        <!-- ÜST KONTROL VE ARAMA BAR -->
        <header class="top-bar">
            <div class="search-container">
                <input type="text" id="searchQuery" class="form-control search-input-dark" placeholder="Marka, renk, materyal veya ürün ara..." onkeyup="loadProducts()">
                
                <!-- YENİLENEN YAN YANA KARE IKON BUTONLARI -->
                <button id="btnUpdate" class="btn-icon-square btn-update-dark" title="Verileri Güncelle" onclick="triggerUpdate()">
                    <svg id="updateIcon" class="svg-icon" viewBox="0 0 24 24">
                        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                    </svg>
                </button>

                <button class="btn-icon-square btn-clear-dark" title="Filtreleri Temizle" onclick="clearAllFilters()">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M19.36 6.36l-1.42-1.42L12 10.59 6.06 4.64 4.64 6.06 10.59 12l-5.95 5.94 1.42 1.42L12 13.41l5.94 5.95 1.42-1.42L13.41 12z"/>
                    </svg>
                </button>
            </div>

            <div id="resultCount" class="stats-bar">Yükleniyor...</div>
        </header>

        <!-- ÜRÜN KARTLARI DİZİLİMİ (GRID) -->
        <div id="productList" class="products-grid">
            <div class="text-center w-100 py-5 text-secondary">
                <div class="spinner-border text-dark" role="status"></div>
                <p class="mt-2">Filamentler Yükleniyor...</p>
            </div>
        </div>
    </main>
</div>

<script>
function getColorHex(colorName) {
    if (!colorName) return '#adb5bd';
    const c = colorName.toLowerCase().trim();
    if (c.includes('kırmızı')) return '#dc3545';
    if (c.includes('mavi')) return '#0d6efd';
    if (c.includes('yeşil')) return '#198754';
    if (c.includes('sarı')) return '#ffc107';
    if (c.includes('siyah')) return '#212529';
    if (c.includes('beyaz')) return '#cccccc';
    if (c.includes('turuncu')) return '#fd7e14';
    if (c.includes('mor')) return '#6f42c1';
    if (c.includes('pembe')) return '#d63384';
    if (c.includes('gri')) return '#6c757d';
    return '#ff9900';
}

async function loadFilters() {
    try {
        const res = await fetch('/api/filters');
        const data = await res.json();
        
        populateSelect('filterSource', data.source, 'Tüm Siteler');
        populateSelect('filterBrand', data.brand, 'Tüm Markalar');
        populateSelect('filterMaterial', data.material, 'Tüm Materyaller');
        populateSelect('filterColor', data.color, 'Tüm Renkler');
    } catch (e) {
        console.error(e);
    }
}

function populateSelect(id, items, defaultText) {
    const select = document.getElementById(id);
    const currentValue = select.value;
    select.innerHTML = `<option value="">${defaultText}</option>`;
    if(items) {
        items.forEach(item => {
            select.innerHTML += `<option value="${item}">${item}</option>`;
        });
    }
    select.value = currentValue;
}

async function loadProducts() {
    const source = document.getElementById('filterSource').value;
    const brand = document.getElementById('filterBrand').value;
    const material = document.getElementById('filterMaterial').value;
    const color = document.getElementById('filterColor').value;
    const q = document.getElementById('searchQuery').value;

    const url = `/api/products?source=${encodeURIComponent(source)}&brand=${encodeURIComponent(brand)}&material=${encodeURIComponent(material)}&color=${encodeURIComponent(color)}&q=${encodeURIComponent(q)}`;
    
    const res = await fetch(url);
    const products = await res.json();
    
    const countBar = document.getElementById('resultCount');
    countBar.innerHTML = `Toplam <span>${products.length}</span> adet filament bulundu`;

    const list = document.getElementById('productList');
    if (products.length === 0) {
        list.innerHTML = `<div class="w-100 text-center py-5 text-muted">Aramanızla eşleşen stokta filament bulunamadı.</div>`;
        return;
    }

    list.innerHTML = products.map(p => {
        const fallbackImg = "https://via.placeholder.com/200x200?text=3D+Filament";
        const imgSrc = p.image && p.image.trim() !== "" ? p.image : fallbackImg;
        const stripColor = getColorHex(p.color);

        return `
        <div class="filament-card">
            <div class="card-color-strip" style="background-color: ${stripColor};"></div>
            <div class="card-img-wrap">
                <img src="${imgSrc}" alt="${p.name}" onerror="this.onerror=null;this.src='${fallbackImg}';">
            </div>
            <div class="card-body-custom">
                <div class="brand-badge">${p.brand || p.source}</div>
                <div class="product-title-custom" title="${p.name}">${p.name}</div>
                <div class="tags-row">
                    <span class="tag-pill">${p.material}</span>
                    <span class="tag-pill">${p.color}</span>
                </div>
                <div class="price-section">
                    <span class="price-main">${p.price} TL</span>
                    <span class="price-sub">${p.kg_price ? Math.round(p.kg_price) + ' TL/kg' : ''}</span>
                </div>
                <a href="${p.url}" target="_blank" class="btn-buy-orange">Siteye Git ↗</a>
            </div>
        </div>
    `}).join('');
}

function clearAllFilters() {
    document.getElementById('filterSource').value = '';
    document.getElementById('filterBrand').value = '';
    document.getElementById('filterMaterial').value = '';
    document.getElementById('filterColor').value = '';
    document.getElementById('searchQuery').value = '';
    loadProducts();
}

async function triggerUpdate() {
    const btn = document.getElementById('btnUpdate');
    const icon = document.getElementById('updateIcon');
    
    btn.disabled = true;
    icon.classList.add('spinning');
    
    await fetch('/api/update', { method: 'POST' });
    
    setTimeout(() => {
        btn.disabled = false;
        icon.classList.remove('spinning');
        loadFilters();
        loadProducts();
    }, 8000);
}

loadFilters();
loadProducts();
</script>
</body>
</html>
