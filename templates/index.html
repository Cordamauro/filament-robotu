<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Filament Arama Motoru - Fiyat Karşılaştırma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #111111;
            color: #d1d1d1;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-size: 13px;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* GÖRSELDEKİ BİREBİR SOL DAR SIDEBAR (210px) */
        .sidebar {
            width: 210px;
            background-color: #171717;
            border-right: 1px solid #282828;
            padding: 0.8rem 0.6rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            overflow-y: auto;
            max-height: 100vh;
        }

        /* LOGO VE BAŞLIK ALANI */
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid #282828;
            margin-bottom: 0.2rem;
        }

        .owl-logo-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #e8d8c8;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-text {
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .brand-text span {
            color: #ff9900;
        }

        /* AKORDEON ELEMANLARI */
        .accordion-item-custom {
            border-bottom: 1px solid #222222;
            padding-bottom: 0.4rem;
        }

        .accordion-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0.35rem 0.2rem;
            user-select: none;
            transition: color 0.15s;
        }

        .accordion-header-custom:hover {
            color: #ff9900;
        }

        .accordion-icon {
            font-size: 0.95rem;
            font-weight: 600;
            color: #888888;
        }

        .accordion-content {
            display: none;
            flex-direction: column;
            gap: 4px;
            margin-top: 0.3rem;
            padding-bottom: 0.2rem;
            max-height: 220px;
            overflow-y: auto;
        }

        .accordion-item-custom.active .accordion-content {
            display: flex;
        }

        /* SEÇENEK BUTONLARI (PILLS) */
        .filter-btn-pill {
            background-color: #222222;
            border: 1px solid #2d2d2d;
            color: #b5b5b5;
            font-size: 0.72rem;
            font-weight: 500;
            padding: 0.32rem 0.6rem;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .filter-btn-pill:hover {
            background-color: #2a2a2a;
            color: #ffffff;
            border-color: #3d3d3d;
        }

        .filter-btn-pill.selected {
            background-color: #ff9900;
            color: #111111;
            border-color: #ff9900;
            font-weight: 700;
        }

        /* SAĞ ANA İÇERİK ALANI */
        .main-content {
            flex-grow: 1;
            background-color: #e2e2e2;
            color: #222222;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background-color: #171717;
            color: #ffffff;
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 1px solid #282828;
        }

        .search-container {
            flex-grow: 1;
            max-width: 480px;
            display: flex;
            gap: 6px;
        }

        .search-input-dark {
            background-color: #242424;
            border: 1px solid #333333;
            color: #ffffff;
            font-size: 0.8rem;
            padding: 0.35rem 0.7rem;
            border-radius: 5px;
        }

        .search-input-dark:focus {
            background-color: #2a2a2a;
            color: #ffffff;
            border-color: #ff9900;
            box-shadow: none;
        }

        .search-input-dark::placeholder {
            color: #777777;
        }

        .btn-icon-square {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border: none;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-update-dark {
            background: #ff9900;
            color: #111111;
        }

        .btn-update-dark:hover {
            background: #e68a00;
        }

        .btn-clear-dark {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #ffffff;
        }

        .btn-clear-dark:hover {
            background: #383838;
        }

        .stats-bar {
            font-size: 0.8rem;
            color: #999999;
            font-weight: 500;
        }

        .stats-bar span {
            color: #ffffff;
            font-weight: 700;
        }

        /* GRID ÜRÜN KARTLARI */
        .products-grid {
            padding: 0.8rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 0.6rem;
            overflow-y: auto;
        }

        /* BEYAZ MİNİMALİST KARTLAR */
        .filament-card {
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #d5d5d5;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .filament-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .card-color-strip {
            height: 3px;
            width: 100%;
        }

        .card-img-wrap {
            height: 105px;
            background: #fafafa;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            text-decoration: none;
        }

        .card-img-wrap img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: transform 0.15s ease;
        }

        .card-img-wrap:hover img {
            transform: scale(1.05);
        }

        .card-body-custom {
            padding: 8px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .brand-badge {
            font-size: 0.6rem;
            font-weight: 700;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 2px;
        }

        .product-title-custom {
            font-size: 0.75rem;
            font-weight: 600;
            color: #111111;
            line-height: 1.15;
            height: 2.3em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 4px;
        }

        .tags-row {
            display: flex;
            gap: 3px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .tag-pill {
            font-size: 0.6rem;
            font-weight: 600;
            padding: 1px 5px;
            border-radius: 3px;
            background: #f2f2f2;
            color: #555555;
            border: 1px solid #e2e2e2;
        }

        .price-section {
            margin-top: auto;
            padding-top: 4px;
            border-top: 1px solid #f4f4f4;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .price-main {
            font-size: 0.95rem;
            font-weight: 800;
            color: #111111;
        }

        .price-sub {
            font-size: 0.65rem;
            color: #777777;
            font-weight: 600;
        }

        .btn-buy-orange {
            background-color: #ff9900;
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            padding: 5px;
            border-radius: 4px;
            margin-top: 6px;
            display: block;
            transition: background 0.15s;
        }

        .btn-buy-orange:hover {
            background-color: #e68a00;
            color: #ffffff;
        }

        .svg-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .spinning {
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- SOL SIDEBAR (YUVARLAK BAYKUŞ LOGOLU VE BAŞLIKLI) -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="owl-logo-circle">
                <svg width="20" height="20" viewBox="0 0 100 100" fill="none">
                    <path d="M50 18C40 18 30 22 28 28C28 38 35 48 50 48C65 48 72 38 72 28C70 22 60 18 50 18Z" fill="#3e2312"/>
                    <circle cx="38" cy="38" r="10" fill="#3e2312"/>
                    <circle cx="62" cy="38" r="10" fill="#3e2312"/>
                    <circle cx="38" cy="38" r="6" fill="#e8d8c8"/>
                    <circle cx="62" cy="38" r="6" fill="#e8d8c8"/>
                    <circle cx="38" cy="38" r="3" fill="#3e2312"/>
                    <circle cx="62" cy="38" r="3" fill="#3e2312"/>
                    <polygon points="50,42 46,50 54,50" fill="#e8d8c8"/>
                    <path d="M26 44C26 65 38 85 50 85C62 85 74 65 74 44C65 52 50 54 50 54C50 54 35 52 26 44Z" fill="#3e2312"/>
                </svg>
            </div>
            <div class="brand-text">Filament<span>Robotu</span></div>
        </div>

        <!-- MATERYAL -->
        <div class="accordion-item-custom">
            <div class="accordion-header-custom" onclick="toggleAccordion(this)">
                <span>MATERYAL</span>
                <span class="accordion-icon">+</span>
            </div>
            <div id="listMaterial" class="accordion-content"></div>
        </div>

        <!-- MARKA -->
        <div class="accordion-item-custom">
            <div class="accordion-header-custom" onclick="toggleAccordion(this)">
                <span>MARKA</span>
                <span class="accordion-icon">+</span>
            </div>
            <div id="listBrand" class="accordion-content"></div>
        </div>

        <!-- RENK -->
        <div class="accordion-item-custom">
            <div class="accordion-header-custom" onclick="toggleAccordion(this)">
                <span>RENK</span>
                <span class="accordion-icon">+</span>
            </div>
            <div id="listColor" class="accordion-content"></div>
        </div>

        <!-- MAĞAZA -->
        <div class="accordion-item-custom">
            <div class="accordion-header-custom" onclick="toggleAccordion(this)">
                <span>MAĞAZA</span>
                <span class="accordion-icon">+</span>
            </div>
            <div id="listSource" class="accordion-content"></div>
        </div>
    </aside>

    <!-- SAĞ ANA İÇERİK ALANI -->
    <main class="main-content">
        <!-- ÜST ARAMA BAR -->
        <header class="top-bar">
            <div class="search-container">
                <input type="text" id="searchQuery" class="form-control search-input-dark" placeholder="Arama yapın..." onkeyup="loadProducts()">
                
                <button id="btnUpdate" class="btn-icon-square btn-update-dark" title="Verileri Güncelle" onclick="triggerUpdate()">
                    <svg id="updateIcon" class="svg-icon" viewBox="0 0 24 24">
                        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                    </svg>
                </button>

                <button class="btn-icon-square btn-clear-dark" title="Filtreleri Temizle" onclick="clearAllFilters()">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M19.36 6.36l-1.42-1.42L12 10.59 6.06 4.64 4.64 6.06 10.59 12l-5.95 5.94 1.42 1.42L12 13.41l5.94 5.95 1.42-1.42L13.41 12z"/>
                    </svg>
                </button>
            </div>

            <div id="resultCount" class="stats-bar">Yükleniyor...</div>
        </header>

        <!-- GRID ÜRÜN KARTLARI -->
        <div id="productList" class="products-grid">
            <div class="text-center w-100 py-5 text-secondary">
                <div class="spinner-border text-dark" role="status"></div>
                <p class="mt-2">Filamentler Yükleniyor...</p>
            </div>
        </div>
    </main>
</div>

<script>
let selectedFilters = {
    source: '',
    brand: '',
    material: '',
    color: ''
};

function toggleAccordion(headerElem) {
    const item = headerElem.parentElement;
    const icon = headerElem.querySelector('.accordion-icon');
    item.classList.toggle('active');
    icon.textContent = item.classList.contains('active') ? '-' : '+';
}

function getColorHex(colorName) {
    if (!colorName) return '#adb5bd';
    const c = colorName.toLowerCase().trim();
    if (c.includes('kırmızı')) return '#dc3545';
    if (c.includes('mavi')) return '#0d6efd';
    if (c.includes('yeşil')) return '#198754';
    if (c.includes('sarı')) return '#ffc107';
    if (c.includes('siyah')) return '#212529';
    if (c.includes('beyaz')) return '#cccccc';
    if (c.includes('turuncu')) return '#fd7e14';
    if (c.includes('mor')) return '#6f42c1';
    if (c.includes('pembe')) return '#d63384';
    if (c.includes('gri')) return '#6c757d';
    return '#ff9900';
}

async function loadFilters() {
    try {
        const res = await fetch('/api/filters');
        const data = await res.json();
        
        renderPills('listSource', data.source, 'source');
        renderPills('listBrand', data.brand, 'brand');
        renderPills('listMaterial', data.material, 'material');
        renderPills('listColor', data.color, 'color');
    } catch (e) {
        console.error(e);
    }
}

function renderPills(containerId, items, filterType) {
    const container = document.getElementById(containerId);
    if (!items || items.length === 0) {
        container.innerHTML = `<span class="text-muted" style="font-size:0.7rem;">Veri yok</span>`;
        return;
    }

    container.innerHTML = items.map(item => {
        const isSelected = selectedFilters[filterType] === item;
        return `
            <button class="filter-btn-pill ${isSelected ? 'selected' : ''}" 
                    onclick="selectFilter('${filterType}', '${item}')"
                    title="${item}">
                <span>${item}</span>
            </button>
        `;
    }).join('');
}

function selectFilter(filterType, value) {
    if (selectedFilters[filterType] === value) {
        selectedFilters[filterType] = '';
    } else {
        selectedFilters[filterType] = value;
    }
    loadFilters();
    loadProducts();
}

async function loadProducts() {
    const q = document.getElementById('searchQuery').value;

    const url = `/api/products?source=${encodeURIComponent(selectedFilters.source)}&brand=${encodeURIComponent(selectedFilters.brand)}&material=${encodeURIComponent(selectedFilters.material)}&color=${encodeURIComponent(selectedFilters.color)}&q=${encodeURIComponent(q)}`;
    
    const res = await fetch(url);
    const products = await res.json();
    
    const countBar = document.getElementById('resultCount');
    countBar.innerHTML = `Toplam <span>${products.length}</span> adet filament bulundu`;

    const list = document.getElementById('productList');
    if (products.length === 0) {
        list.innerHTML = `<div class="w-100 text-center py-5 text-muted">Aramanızla eşleşen stokta filament bulunamadı.</div>`;
        return;
    }

    list.innerHTML = products.map(p => {
        const fallbackImg = "https://via.placeholder.com/150x150?text=3D+Filament";
        const imgSrc = p.image && p.image.trim() !== "" ? p.image : fallbackImg;
        const stripColor = getColorHex(p.color);

        return `
        <div class="filament-card">
            <div class="card-color-strip" style="background-color: ${stripColor};"></div>
            
            <a href="${p.url}" target="_blank" class="card-img-wrap" title="${p.name} - Mağazaya Git">
                <img src="${imgSrc}" alt="${p.name}" onerror="this.onerror=null;this.src='${fallbackImg}';">
            </a>

            <div class="card-body-custom">
                <div class="brand-badge">${p.brand || p.source}</div>
                <div class="product-title-custom" title="${p.name}">${p.name}</div>
                <div class="tags-row">
                    <span class="tag-pill">${p.material}</span>
                    <span class="tag-pill">${p.color}</span>
                </div>
                <div class="price-section">
                    <span class="price-main">${p.price} TL</span>
                    <span class="price-sub">${p.kg_price ? Math.round(p.kg_price) + ' TL/kg' : ''}</span>
                </div>
                <a href="${p.url}" target="_blank" class="btn-buy-orange">Siteye Git ↗</a>
            </div>
        </div>
    `}).join('');
}

function clearAllFilters() {
    selectedFilters = { source: '', brand: '', material: '', color: '' };
    document.getElementById('searchQuery').value = '';
    loadFilters();
    loadProducts();
}

async function triggerUpdate() {
    const btn = document.getElementById('btnUpdate');
    const icon = document.getElementById('updateIcon');
    
    btn.disabled = true;
    icon.classList.add('spinning');
    
    await fetch('/api/update', { method: 'POST' });
    
    setTimeout(() => {
        btn.disabled = false;
        icon.classList.remove('spinning');
        loadFilters();
        loadProducts();
    }, 8000);
}

loadFilters();
loadProducts();
</script>
</body>
</html>
